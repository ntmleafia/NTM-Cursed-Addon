name: Build and Release

on:
  workflow_dispatch:
  push:
    tags: [ 'V-*' ]
jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download HBM's NTM CE 2.5.0.2 for compilation stability
        run: wget https://mediafilez.forgecdn.net/files/8022/349/ntm-ce-2.5.0.2.jar -O ~/NTM-CE-1.12.2-2.5.0.2.jar
      
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle
      
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Gradle Decomp Workspace Setup
        run: ./gradlew setupDecompWorkspace
      
      - name: Build with Gradle
        run: ./gradlew build
        env:
          ORG_GRADLE_PROJECT_org_gradle_jvmargs: -Xmx3G
      
      - name: Upload to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: build/libs/NTM_Cursed_Edition-CE_Addon.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clear Gradle cache
        run: ./gradlew clean
